# Included inside the http {} block of the base image.
server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/xml application/xml image/svg+xml text/plain;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types application/json application/javascript text/css text/xml application/xml image/svg+xml text/plain;
    etag on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed bundles never change: cache for a year.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # The index changes every build: always revalidate, so the ETag poll gets a cheap 304.
    location /data/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Badges are embedded in other people's READMEs.
    location /badge/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri $uri/ =404;
    }
}
