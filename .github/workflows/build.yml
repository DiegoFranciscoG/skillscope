name: Build and deploy

# Layer 1 of the self-update: GitHub's own cron, off the hour because scheduled runs are
# delayed or dropped at the start of each hour (docs/investigacion.md #16). Layer 2: every run
# queues the next one (jobs next-now / next-later below), so updates continue even when GitHub
# never fires the cron. Layer 3 is keepalive.yml (docs/despliegue.md).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

# One build at a time; a queued run waits instead of cancelling a deploy halfway.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Acceptance criterion: the build always ends in under 10 minutes. The pipeline itself
    # stops collecting at SKILLSCOPE_MAX_SECONDS and publishes what it already has.
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      catch_up: ${{ steps.collect.outputs.catch_up }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Restore pipeline state (ETags, cursors, analysis cache, signals)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/state/live
            data/raw/live
          key: pipeline-state-v1-${{ github.run_id }}
          restore-keys: pipeline-state-v1-

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Collect, analyze and index
        id: collect
        env:
          # A fine-grained token raises the REST/GraphQL budget from 1,000 to 5,000 per hour;
          # without it the job uses the repository GITHUB_TOKEN (docs/fuentes.md).
          SKILLSCOPE_GITHUB_TOKEN: ${{ secrets.SKILLSCOPE_GH_TOKEN || github.token }}
          SKILLSCOPE_SITE_URL: ${{ vars.SKILLSCOPE_SITE_URL || steps.pages.outputs.base_url }}
          SKILLSCOPE_REPOSITORY: ${{ github.repository }}
          SKILLSCOPE_MAX_SECONDS: "360"
          # Optional repository variables; empty means the defaults in pipeline/config.py.
          SKILLSCOPE_BUDGET_REST: ${{ vars.SKILLSCOPE_BUDGET_REST }}
          SKILLSCOPE_BUDGET_GRAPHQL: ${{ vars.SKILLSCOPE_BUDGET_GRAPHQL }}
          SKILLSCOPE_STACKEXCHANGE_KEY: ${{ secrets.SKILLSCOPE_STACKEXCHANGE_KEY }}
          SKILLSCOPE_REDDIT_CLIENT_ID: ${{ secrets.SKILLSCOPE_REDDIT_CLIENT_ID }}
          SKILLSCOPE_REDDIT_CLIENT_SECRET: ${{ secrets.SKILLSCOPE_REDDIT_CLIENT_SECRET }}
          SKILLSCOPE_REDDIT_USER_AGENT: ${{ vars.SKILLSCOPE_REDDIT_USER_AGENT }}
          SKILLSCOPE_BLUESKY_HANDLE: ${{ vars.SKILLSCOPE_BLUESKY_HANDLE }}
          SKILLSCOPE_BLUESKY_APP_PASSWORD: ${{ secrets.SKILLSCOPE_BLUESKY_APP_PASSWORD }}
          SKILLSCOPE_YOUTUBE_API_KEY: ${{ secrets.SKILLSCOPE_YOUTUBE_API_KEY }}
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python -m pipeline build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the static front and scan it for credentials
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run scan:bundle

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Save pipeline state
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/state/live
            data/raw/live
          key: pipeline-state-v1-${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Layer 2. While the queue is long and a personal token gives 5,000 calls/h, the next build
  # starts right away; otherwise it waits in the "cadence" environment (wait timer of 20 min,
  # no runner minutes used while waiting), so the site refreshes about every 30 minutes.
  next-now:
    needs: [build, deploy]
    if: always() && needs.build.outputs.catch_up == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Queue the next build (catching up with the queue)
        run: |
          busy=$(gh run list --workflow build.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ "$busy" -gt 0 ]; then echo "Another build is already queued or running."; exit 0; fi
          gh workflow run build.yml --ref "$GITHUB_REF_NAME"

  next-later:
    needs: [build, deploy]
    if: always() && needs.build.result != 'cancelled' && needs.build.outputs.catch_up != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cadence
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Queue the next build unless GitHub's cron or another run already will
        run: |
          busy=$(gh run list --workflow build.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ "$busy" -gt 0 ]; then echo "Another build is already queued or running."; exit 0; fi
          last=$(gh run list --workflow build.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 1200 ]; then
            echo "GitHub's own cron ran in the last 20 minutes; it keeps the cadence."; exit 0
          fi
          gh workflow run build.yml --ref "$GITHUB_REF_NAME"
