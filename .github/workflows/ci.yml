name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (verified SHA-256)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

  python:
    name: Pipeline (lint, types, tests, coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Tests with coverage (collector, analyzer, indexer >= 70 %)
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  web:
    name: Web (types, unit, build, bundle scan, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Offline build with fictional samples
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python -m pipeline build --offline
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Unit tests with coverage
        working-directory: web
        run: npm run test:coverage
      - name: Build and scan the published bundle for credentials
        working-directory: web
        run: |
          npm run build
          npm run scan:bundle
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop and mobile)
        working-directory: web
        run: npm run e2e
      - name: Lighthouse (performance and accessibility >= 95, median of 3 runs)
        working-directory: web
        run: |
          npm run preview > /dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -fs http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run lighthouse
      - name: Keep the Playwright and Lighthouse reports when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-reports
          path: |
            web/playwright-report/
            web/lighthouse-report/
          retention-days: 7
